name: yak_takip
description: Akıllı yakıt takip uygulaması
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & State
  http: ^1.2.1
  shared_preferences: ^2.2.3
  provider: ^6.1.2

  # Camera & Image
  image_picker: ^1.1.2
  camera: ^0.11.0+2

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Utils
  intl: ^0.19.0
  flutter_secure_storage: ^9.2.2

flutter:
  uses-material-design: true
  assets:
    - assets/
