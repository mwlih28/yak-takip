name: Build Android APK

on:
  push:
    branches: [claude/fuel-tracking-ai-app-9ie2vb, main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Flutter ile boş proje oluştur
        run: |
          flutter create --org com.yakittakip --project-name yak_takip /tmp/flutter_skeleton
          echo "Boş proje oluşturuldu"

      - name: Android iskeletini kopyala
        run: |
          # Boş projedeki Android iskeletini mobile/ içine kopyala
          cp -r /tmp/flutter_skeleton/android /home/runner/work/yak-takip/yak-takip/mobile/
          echo "Android iskelet kopyalandı"

      - name: Bağımlılıkları indir
        working-directory: mobile
        run: flutter pub get

      - name: APK derle
        working-directory: mobile
        run: flutter build apk --release --no-tree-shake-icons

      - name: APK artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: yak-takip-${{ github.run_number }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
